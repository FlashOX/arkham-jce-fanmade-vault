<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>… | Les Archives Miskatoniques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Spectral:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181c;
    --bg-elevated: #1f2025;
    --card: #212228;
    --border: #2c2d34;
    --text: #e7e6e3;
    --text-dim: #9a9aa2;
    --accent: #7d6b9e;
    --accent-soft: rgba(125,107,158,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
  }
  a { color: var(--accent); }
  header {
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
  }
  header a.back { font-size: 0.85rem; color: var(--text-dim); text-decoration: none; }
  header a.back:hover { color: var(--text); }

  main { max-width: 760px; margin: 0 auto; padding: 32px 32px 60px; }

  .cover {
    width: 100%;
    aspect-ratio: 16 / 7;
    border-radius: 10px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent-soft), #14151a 70%);
    margin-bottom: 24px;
    position: relative;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-title {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 24px;
    background: rgba(10, 10, 14, 0.5);
  }
  .cover-title h1 {
    font-family: 'Spectral', serif;
    font-size: 1.8rem;
    margin: 0;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }
  .meta .vo { color: var(--text-dim); font-style: italic; font-size: 0.9rem; }

  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 7px;
    padding: 9px 16px;
    color: #cabfe0;
    text-decoration: none;
    font-size: 0.88rem;
    margin-bottom: 28px;
    transition: background 0.15s, color 0.15s;
  }
  .dl-btn:hover { background: var(--accent); color: var(--bg); }
  .dl-btn svg { width: 16px; height: 16px; }

  .resume { font-size: 0.98rem; line-height: 1.7; white-space: pre-line; margin-bottom: 32px; }

  .box {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 32px;
    overflow: hidden;
  }
  .box h2 {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    margin: 0;
    padding: 12px 16px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }
  .box ul { list-style: none; margin: 0; padding: 0; }
  .box li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .box li:last-child { border-bottom: none; }
  .box .fname { color: var(--text); }
  .box .fsize { color: var(--text-dim); font-size: 0.8rem; white-space: nowrap; }
  .box a.fdl { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .box a.fdl:hover { text-decoration: underline; }
  .box .clabel { color: var(--text-dim); }
  .box .cvalue { color: var(--text); text-align: right; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }
  .gallery img {
    width: 100%;
    border-radius: 8px;
    display: block;
    border: 1px solid var(--border);
  }

  #status { color: var(--text-dim); padding: 24px 32px; }
</style>
</head>
<body>

<header>
  <a class="back" href="./">← Retour aux Archives Miskatoniques</a>
</header>

<main id="main" hidden>
  <div class="cover" id="cover">
    <div class="cover-title"><h1 id="titre"></h1></div>
  </div>
  <div class="meta" id="meta"></div>
  <div id="dlWrap"></div>
  <div class="box" id="creditsBox" hidden>
    <h2>Crédits</h2>
    <ul id="creditsList"></ul>
  </div>
  <div class="box" id="filesBox" hidden>
    <h2>Fichiers disponibles</h2>
    <ul id="filesList"></ul>
  </div>
  <div class="resume" id="resume"></div>
  <div class="gallery" id="gallery"></div>
</main>
<p id="status">Chargement…</p>

<script>
const IA_ARCHIVE = (id) => `https://archive.org/compress/${encodeURIComponent(id)}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const id = new URLSearchParams(location.search).get("id");

Promise.all([
  fetch("data/catalogue.json", { cache: "no-cache" }).then((r) => r.json()),
  fetch("data/synopsis.json", { cache: "no-cache" }).then((r) => r.json()),
])
  .then(([cat, syn]) => {
    const it = cat.items.find((i) => i.id === id);
    const s = syn.items[id];
    if (!it || !s) {
      document.getElementById("status").textContent = "Fiche introuvable.";
      return;
    }

    document.title = `${it.titre} | Les Archives Miskatoniques`;
    document.getElementById("titre").textContent = it.titre;

    const cover = document.getElementById("cover");
    if (it.image) {
      const img = document.createElement("img");
      img.src = it.image;
      img.alt = `Illustration — ${it.titre}`;
      cover.insertBefore(img, cover.firstChild);
    }

    const meta = document.getElementById("meta");
    meta.innerHTML = it.titreVO ? `<span class="vo">VO : ${esc(it.titreVO)}</span>` : "";

    const dlWrap = document.getElementById("dlWrap");
    dlWrap.innerHTML = it.archive
      ? `<a class="dl-btn" href="${esc(IA_ARCHIVE(it.archive.id))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg> Télécharger l'archive complète</a>`
      : `<span style="color:var(--text-dim); font-size:0.88rem;">Pas encore hébergé — bientôt disponible.</span>`;

    document.getElementById("resume").textContent = s.resume;

    const creditRows = [];
    if (it.creator) creditRows.push(["Auteur original", it.creator]);
    if (it.traducteur) creditRows.push(["Traduction", it.traducteur]);
    if (creditRows.length) {
      document.getElementById("creditsList").innerHTML = creditRows
        .map(([label, value]) => `<li><span class="clabel">${esc(label)}</span><span class="cvalue">${esc(value)}</span></li>`)
        .join("");
      document.getElementById("creditsBox").hidden = false;
    }

    const gallery = document.getElementById("gallery");
    gallery.innerHTML = (s.illustrations || [])
      .map((src) => `<img src="${esc(src)}" alt="Illustration de carte — ${esc(it.titre)}" loading="lazy">`)
      .join("");

    document.getElementById("status").hidden = true;
    document.getElementById("main").hidden = false;

    if (it.archive) loadFiles(it.archive.id);
  })
  .catch((e) => {
    document.getElementById("status").textContent = "Impossible de charger la fiche (" + e.message + ").";
  });

// Liste des fichiers individuels de l'item archive.org, en complément du
// bouton "archive complète". Chargé à part et silencieusement ignoré en
// cas d'échec (l'API archive.org peut être lente ou temporairement down).
const FILE_LABELS = [
  [/guide/i, "Guide"],
  [/planche/i, "Planche d'impression"],
  [/cartes|images/i, "Cartes (images)"],
];
const labelFor = (name) => (FILE_LABELS.find(([re]) => re.test(name)) || [null, name])[1];
const formatSize = (bytes) => {
  const mb = bytes / 1048576;
  return mb >= 1 ? mb.toFixed(1) + " Mo" : (bytes / 1024).toFixed(0) + " Ko";
};

function loadFiles(archiveId) {
  fetch(`https://archive.org/metadata/${encodeURIComponent(archiveId)}`)
    .then((r) => r.json())
    .then((meta) => {
      const files = (meta.files || []).filter(
        (f) => !f.name.includes("/") && /\.(pdf|zip)$/i.test(f.name),
      );
      if (!files.length) return;
      document.getElementById("filesList").innerHTML = files
        .map(
          (f) => `<li>
            <span class="fname">${esc(labelFor(f.name))}${f.size ? ` <span class="fsize">(${esc(formatSize(Number(f.size)))})</span>` : ""}</span>
            <a class="fdl" href="https://archive.org/download/${esc(archiveId)}/${esc(f.name)}" target="_blank">Télécharger ↓</a>
          </li>`,
        )
        .join("");
      document.getElementById("filesBox").hidden = false;
    })
    .catch(() => {});
}
</script>

</body>
</html>
